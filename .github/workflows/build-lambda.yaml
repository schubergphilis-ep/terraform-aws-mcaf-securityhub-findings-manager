name: Build and Package Lambda(s)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
    paths:
      - files/lambda-artifacts/**
      - .github/workflows/build-lambda.yaml

permissions:
  contents: write
  pull-requests: write

env:
  LAMBDA_DIR: "files/lambda-artifacts"
  PKG_DIR: "files/pkg"

jobs:
  pkg:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"] # singly entry until Python >3.12 is supported by all dependencies
        lambda-name: ["securityhub-findings-manager", "findings-manager-jira"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd $LAMBDA_DIR/${{ matrix.lambda-name }}
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Lambda deployment package
        run: |
          mkdir -p $PKG_DIR

          # Navigate to site-packages
          cd $LAMBDA_DIR/${{ matrix.lambda-name }}/venv/lib/python${{ matrix.python-version }}/site-packages

          # Removing nonessential files 'https://github.com/aws-powertools/powertools-lambda-layer-cdk/blob/d24716744f7d1f37617b4998c992c4c067e19e64/layer/Python/Dockerfile'
          rm -rf boto* s3transfer* *dateutil* urllib3* six* jmespath*
          # Every Lambda built by this workflow already gets aws-lambda-powertools from the
          # shared powertools_layer_arn layer (see findings_manager.tf/jira_lambda.tf); a
          # dependency accidentally pulling it (and its typing_extensions dependency) back into
          # requirements.txt should not end up duplicated inside the deployment package too.
          rm -rf aws_lambda_powertools* typing_extensions*
          # The venv seeds pip (and 'pip install --upgrade pip' refreshes it) into site-packages;
          # the Lambda never uses it, so keep it out of the deployment package.
          rm -rf pip* _distutils_hack* setuptools* pkg_resources* distutils-precedence.pth
          find . -name '*.so' -type f -exec strip "{}" \;
          find . -wholename "*/tests/*" -type f -delete
          find . -regex '^.*\(__pycache__\|\.py[co]\)$' -delete
          # Remove dependency lock files shipped inside packages (e.g. a library's Pipfile.lock).
          # Inspector scans these as an SBOM and reports phantom CVEs for packages that aren't actually installed.
          find . \( -name 'Pipfile' -o -name 'Pipfile.lock' \) -type f -delete

          # Remove old package
          rm ../../../../../../../$PKG_DIR/lambda_${{ matrix.lambda-name }}_python${{ matrix.python-version }}.zip

          # Package the lambda function. Package the dependencies and then add the source code to the created zip to ensure a flat archive structure.
          zip -r ../../../../../../../$PKG_DIR/lambda_${{ matrix.lambda-name }}_python${{ matrix.python-version }}.zip .
          cd ../../../../
          zip -g ../../../$PKG_DIR/lambda_${{ matrix.lambda-name }}_python${{ matrix.python-version }}.zip -r  * --exclude venv/\* --exclude requirements-dev.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lambda_${{ matrix.lambda-name }}_python${{ matrix.python-version }}.zip
          path: files/pkg/lambda_${{ matrix.lambda-name }}_python${{ matrix.python-version }}.zip

  # Download all artifacts and commit them to the repository. This seperate job prevents a push to the repository per zip file due to the matrix.
  push:
    runs-on: ubuntu-latest
    needs: pkg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Remove old pkg artifacts
        run: rm -rf files/pkg/

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: files/pkg/
          merge-multiple: true

      - name: Commit deployment packages
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Add all Lambda deployment packages"
          file_pattern: "files/pkg/*.zip"

